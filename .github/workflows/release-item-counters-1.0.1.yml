name: Release ItemCounters 1.0.1

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-item-counters-1.0.1.yml'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: 0057c7214c6fe74d6314b7c2c98933cc0711cf7b
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
        with:
          gradle-version: '8.14.3'
      - name: Build ItemCounters 1.0.1
        run: gradle clean test check jar --no-daemon --no-build-cache
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes='Исправлен баг с прочностью: ItemCounters мог заменять ItemStack во время обработки урона и использования предмета, из-за чего мечи и броня могли не терять обычную прочность. В 1.0.1 такие замены убраны или отложены, поэтому ванильный износ снова работает корректно.'
          gh release view 1.0.1 >/dev/null 2>&1 || gh release create 1.0.1 build/libs/item-counters-1.0.1.jar --target 0057c7214c6fe74d6314b7c2c98933cc0711cf7b --title 'ItemCounters 1.0.1' --notes "$notes"
