name: Update 1.0.1 release notes

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-1.0.1-release.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: self-hosted
    timeout-minutes: 10
    steps:
      - name: Update bilingual release notes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES: |
            ## English

            Fixed a durability bug: ItemCounters could replace an ItemStack while damage or item use was being processed, which could cause swords and armor to avoid losing normal durability. In 1.0.1, these replacements were removed or deferred, so vanilla durability works correctly again.

            ## Русский

            Исправлен баг с прочностью: ItemCounters мог заменять ItemStack во время обработки урона и использования предмета, из-за чего мечи и броня могли не терять обычную прочность. В 1.0.1 такие замены убраны или отложены, поэтому ванильный износ снова работает корректно.
        run: |
          if command -v gh >/dev/null 2>&1; then
            gh release edit 1.0.1 --repo der3kyy/item-counters --notes "$NOTES"
          else
            release_id="$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" https://api.github.com/repos/der3kyy/item-counters/releases/tags/1.0.1 | python -c 'import json,sys; print(json.load(sys.stdin)["id"])')"
            python - <<'PY' > "$RUNNER_TEMP/release.json"
import json, os
print(json.dumps({"body": os.environ["NOTES"]}, ensure_ascii=False))
PY
            curl -fsSL -X PATCH               -H "Authorization: Bearer $GH_TOKEN"               -H "Accept: application/vnd.github+json"               -H "X-GitHub-Api-Version: 2022-11-28"               "https://api.github.com/repos/der3kyy/item-counters/releases/$release_id"               --data-binary "@$RUNNER_TEMP/release.json" >/dev/null
          fi
