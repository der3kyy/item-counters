name: Update 1.0.1 release notes

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-1.0.1-release.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: self-hosted
    timeout-minutes: 10
    steps:
      - name: Update bilingual release notes
        shell: python
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          import json
          import os
          import urllib.request

          notes = """## English

          Fixed a durability bug: ItemCounters could replace an ItemStack while damage or item use was being processed, which could cause swords and armor to avoid losing normal durability. In 1.0.1, these replacements were removed or deferred, so vanilla durability works correctly again.

          ## Русский

          Исправлен баг с прочностью: ItemCounters мог заменять ItemStack во время обработки урона и использования предмета, из-за чего мечи и броня могли не терять обычную прочность. В 1.0.1 такие замены убраны или отложены, поэтому ванильный износ снова работает корректно.
          """
          token = os.environ["GH_TOKEN"]
          headers = {
              "Authorization": f"Bearer {token}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "item-counters-release-updater",
          }

          get_req = urllib.request.Request(
              "https://api.github.com/repos/der3kyy/item-counters/releases/tags/1.0.1",
              headers=headers,
          )
          with urllib.request.urlopen(get_req) as response:
              release = json.load(response)

          body = json.dumps({"body": notes}, ensure_ascii=False).encode("utf-8")
          patch_req = urllib.request.Request(
              f"https://api.github.com/repos/der3kyy/item-counters/releases/{release['id']}",
              data=body,
              headers={**headers, "Content-Type": "application/json"},
              method="PATCH",
          )
          with urllib.request.urlopen(patch_req) as response:
              updated = json.load(response)

          print(updated["html_url"])
